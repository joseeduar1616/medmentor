# Publica o site no Cloudflare Workers a cada push.
#
# Antes de funcionar, falta uma coisa só, e ela é feita no GitHub, não aqui:
# guardar o token do Cloudflare em Settings › Secrets and variables › Actions,
# com o nome CLOUDFLARE_API_TOKEN. Enquanto ele não existir, este fluxo avisa
# e para sem erro — nada quebra.
#
# O token fica guardado no GitHub e nunca aparece no repositório nem no log.
name: Publicar no Cloudflare

on:
  push:
    branches:
      - main
      - claude/seguir-arquivo-prompt-l5s9ed
  workflow_dispatch:

# Se dois pushes chegarem juntos, vale o último: não adianta publicar
# uma versão que já foi substituída.
concurrency:
  group: publicar-cloudflare
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A pasta publicar/ já está pronta no repositório, então não há build
      # aqui: o Wrangler só envia o que existe. Isso é de propósito — o build
      # abre um navegador para os testes e isso não cabe neste passo.
      - name: Conferir se há token
        id: token
        env:
          TEM: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: echo "tem=$TEM" >> "$GITHUB_OUTPUT"

      - name: Sem token, não dá para publicar
        if: steps.token.outputs.tem != 'true'
        run: |
          echo "::warning::Falta o segredo CLOUDFLARE_API_TOKEN em Settings › Secrets and variables › Actions. Nada foi publicado."

      - name: Conferir o pacote antes de enviar
        if: steps.token.outputs.tem == 'true'
        run: npx --yes wrangler@4.129.1 deploy --dry-run --outdir=/tmp/conferir

      - name: Publicar
        if: steps.token.outputs.tem == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.129.1 deploy
